<h2>你希望统计页重点对比什么？</h2>
<p class="subtitle">当前的问题总结：数字是孤立的，缺乏上下文。你更想看到哪种对比？</p>

<div class="options">
  <div class="option" data-choice="time" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>环比/同比时间对比</h3>
      <p>本周 vs 上周、本月 vs 上月、今年 vs 去年，直观看到上升/下降</p>
    </div>
  </div>
  <div class="option" data-choice="goal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>目标差距对比</h3>
      <p>每个指标与设定的目标对比，用进度条/颜色清晰地显示达标/离目标还差多少</p>
    </div>
  </div>
  <div class="option" data-choice="trend" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>趋势变化对比</h3>
      <p>图表更丰富——体脂+体重叠加趋势、腰围趋势、力量增长曲线，多维度追踪变化</p>
    </div>
  </div>
  <div class="option" data-choice="all" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>全部都要</h3>
      <p>时间对比 + 目标差距 + 趋势图表，整体翻新布局</p>
    </div>
  </div>
</div>
