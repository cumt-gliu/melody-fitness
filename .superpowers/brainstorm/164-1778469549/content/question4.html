<h2>详细区域怎么布局？</h2>
<p class="subtitle">时间筛选器下方的详细区域，你希望按什么方式组织内容？</p>

<div class="options">
  <div class="option" data-choice="tab" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Tab 分页</h3>
      <p>「训练分析」· 「身体指标」· 「力量进步」三个 Tab，每次只展示一个维度，信息更聚焦</p>
    </div>
  </div>
  <div class="option" data-choice="vertical" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>纵向滚动分区</h3>
      <p>一个长页面，从上到下依次是：周期对比卡片 → 体重趋势 → 训练频率 → 力量进步 → 身体指标，全部可见，不用切 Tab</p>
    </div>
  </div>
  <div class="option" data-choice="grid" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>图表优先 + 指标网格</h3>
      <p>顶部两张大图（体重趋势 + 训练频率），下方用 2-3 列网格展示详细指标卡片，每个卡片自带迷你趋势</p>
    </div>
  </div>
</div>
