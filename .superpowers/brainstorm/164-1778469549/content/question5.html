<h2>Tab 内容和命名</h2>
<p class="subtitle">三个 Tab 你觉得这样划分合理吗？</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="tab1" onclick="toggleSelect(this)">
    <div class="letter">1</div>
    <div class="content">
      <h3>训练分析</h3>
      <p>周训练频次柱状图 · 有氧 vs 力量分布 · 有氧时长趋势 · 训练类型占比（饼/环形图）</p>
    </div>
  </div>
  <div class="option" data-choice="tab2" onclick="toggleSelect(this)">
    <div class="letter">2</div>
    <div class="content">
      <h3>身体指标</h3>
      <p>体重趋势（折线+体脂叠加） · 腰围趋势 · 睡眠趋势 · 疲劳评分趋势 · 各指标周期对比（本期 vs 上期）</p>
    </div>
  </div>
  <div class="option" data-choice="tab3" onclick="toggleSelect(this)">
    <div class="letter">3</div>
    <div class="content">
      <h3>力量进步</h3>
      <p>各动作重量变化趋势 · 最佳重量记录 · 训练容量（总重量）趋势 · 动作维度切换</p>
    </div>
  </div>
</div>
<p style="margin-top:12px;color:#8b8b8b">可以多选调整，或提出修改意见</p>
