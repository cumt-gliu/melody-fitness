<h2>整体页面结构</h2>

<div class="mockup">
  <div class="mockup-body" style="padding:20px;font-size:14px;line-height:1.6;color:#333">

    <div style="background:#1f6f50;color:white;border-radius:12px;padding:16px;margin-bottom:16px">
      <div style="font-weight:bold;margin-bottom:12px">📊 训练统计 <span style="font-weight:normal;font-size:12px;margin-left:8px;opacity:0.8">（概览行 · 固定不变）</span></div>
      <div style="display:flex;gap:10px">
        <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:12px;flex:1;text-align:center">
          <div style="font-size:11px;opacity:0.8">本周训练</div>
          <div style="font-size:24px;font-weight:bold">4 次</div>
          <div style="font-size:11px;color:#a0d8b0">⬆ +1</div>
        </div>
        <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:12px;flex:1;text-align:center">
          <div style="font-size:11px;opacity:0.8">有氧时长</div>
          <div style="font-size:24px;font-weight:bold">85 分钟</div>
          <div style="font-size:11px;color:#f0c080">⬆ +15</div>
        </div>
        <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:12px;flex:1;text-align:center">
          <div style="font-size:11px;opacity:0.8">体重变化</div>
          <div style="font-size:24px;font-weight:bold">-0.8 kg</div>
          <div style="font-size:11px;color:#a0d8b0">⬇ 较上周</div>
        </div>
        <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:12px;flex:1;text-align:center">
          <div style="font-size:11px;opacity:0.8">训练天数</div>
          <div style="font-size:24px;font-weight:bold">3 天</div>
          <div style="font-size:11px;color:#a0d8b0">⬆ +1</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;padding:8px 0;border-bottom:1px solid #e0d8cc">
      <span style="font-weight:500;margin-right:8px">时间范围：</span>
      <span style="background:#1f6f50;color:white;border-radius:20px;padding:6px 14px;font-size:13px">本周</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">本月</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">本季度</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">今年</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">自定义</span>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #e0d8cc;padding-bottom:8px">
      <span style="background:#1f6f50;color:white;border-radius:20px;padding:6px 14px;font-size:13px">训练分析</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">身体指标</span>
      <span style="padding:6px 14px;font-size:13px;color:#666">力量进步</span>
    </div>

    <div style="text-align:center;color:#999;padding:20px;border:2px dashed #d0c8bc;border-radius:12px">
      Tab 内容区域（根据选中 Tab 切换）<br>
      <span style="font-size:12px">受上方时间范围筛选器控制</span>
    </div>

  </div>
</div>

<p class="subtitle" style="margin-top:12px">整体分为三层：概览行 → 时间筛选 + Tab 导航 → Tab 内容</p>
